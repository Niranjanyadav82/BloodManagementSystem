<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Blood Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
        }

        .site-header {
            display: flex;
            align-items: center;
            padding: 16px 5%;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }

        .logo-box img {
            display: block;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: #04AA6D;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .container {
            width: 300px;
            padding: 16px;
            background-color: white;
            margin: 60px auto;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .container h2 {
            text-align: center;
            color: #000;
            margin-bottom: 25px;
        }

        .avatar {
            display: block;
            margin: 0 auto 10px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }

        .login-submit {
            width: 100%;
            background-color: #04AA6D;
            color: white;
            padding: 14px 20px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
        }

        .login-submit:hover {
            opacity: 0.8;
        }

        .error-message {
            color: #b00020;
            text-align: center;
        }

        @media screen and (max-width: 300px) {
            .container {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <a class="logo-box" href="/index">
            <img
                src="{{ url_for('static', filename='images/Mylogo.png') }}"
                alt="Niranjan Yadav"
            >
            <span>Donate</span>
        </a>
    </header>

    <main class="container">
        <h2>Login</h2>

        <img
            src="https://tse4.mm.bing.net/th?id=OIP.Eb7YP11nONtH9hcFCDJe1wHaH0&pid=Api&P=0&h=220"
            alt="Avatar"
            class="avatar"
        >

        {% if res %}
            <p class="error-message">{{ res }}</p>
        {% endif %}

        <form action="/login_verify" method="post">
            <label for="username"><b>Username</b></label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter Username"
                required
            >

            <label for="password"><b>Password</b></label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <input class="login-submit" type="submit" value="Login">
        </form>
    </main>
</body>
</html>
